<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureApp</title>

    <style>
        body {
     margin: 0;
     height: 100vh;
     background: linear-gradient(135deg, #0a192f, #112240, #64ffda);
     display: flex;
     justify-content: center;
     align-items: center;
     color: white;
 }

       .container {
    text-align: center;
    padding: 50px 60px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

          h1 {
    font-size: 48px;
    margin-bottom: 15px;
    letter-spacing: 1px;
}

p {
    font-size: 18px;
    color: #d1d5db;
    margin-bottom: 35px;
}

           .btn {
    padding: 14px 28px;
    margin: 10px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    transition: 0.3s;
}

.login-btn {
    background: #64ffda;
    color: #0a192f;
}

.register-btn {
    background: transparent;
    color: white;
    border: 2px solid #64ffda;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(100,255,218,0.5);
}
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 SecureApp</h1>
    <p>Simple Login & Registration System</p>

    <a href="/loginPage" class="btn login-btn">Login</a>
    <a href="/registerPage" class="btn register-btn">Register</a>
</div>

</body>
</html>
